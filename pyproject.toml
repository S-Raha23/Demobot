[project]
name = "demobot"
version = "2.0.0"
description = "DemoBot: show a robot a tabletop task once, with a phone video, and Meta's models write, test and harden the program."
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlmodel>=0.0.21",
  "openai>=1.80",
  "httpx>=0.27",
  "opencv-contrib-python>=4.10",  # never install opencv-python alongside
  "numpy>=1.26,<3",
  "scipy>=1.13",
  "pybullet>=3.2.6",
  "pillow>=10.4",
  "structlog>=24.1",
  "typer>=0.12",
  "meta-sam-parser==0.1.0",
]

[project.optional-dependencies]
cloud = ["modal>=0.64", "huggingface_hub>=0.25"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
demobot = "demobot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/demobot"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = [".", "backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls a real paid API (run by hand, never in make check)"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "data", "reference", "frontend", "media", "backend/tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # en dashes and × in prose are intended

[tool.ruff.lint.pycodestyle]
max-line-length = 130  # the formatter wraps at 100; hand-formatted request blocks may run longer

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.isort]
known-first-party = ["demobot"]

[tool.mypy]
python_version = "3.11"
files = ["backend/demobot"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"scripts/probe_models.py" = ["E501"]
"scripts/make_fixture_run.py" = ["E501"]
"backend/demobot/program/synth.py" = ["E501"]  # tool schemas and prompt text
"backend/demobot/verify.py" = ["E501"]
"backend/demobot/agents/supervisor.py" = ["E501"]  # the prompt and tool table
"backend/demobot/agents/redteam.py" = ["E501"]
"backend/demobot/pipeline.py" = ["E501"]
"backend/demobot/card.py" = ["E501"]
"backend/tests/**" = ["E501"]
"synth/**" = ["E501"]
